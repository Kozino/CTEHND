<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Group Contributions</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="classic.css"></head><body><div class="wrap">
<header><h1>Group Contributions</h1><div class="rule"></div><p class="sub">The latest list, updated as payments are recorded</p></header>
<main id="out"><p class="empty" style="text-align:center">Loading…</p></main>
<footer id="foot"></footer>
</div><script type="module">
import { api, esc, money, sum, total, groups } from "./app.js";
const fmtDate = (s) => s ? new Date(s).toLocaleDateString(undefined, { day: "numeric", month: "short" }) : "";
const lines = (c) => c.donations.length
  ? `<div class="ledger">${c.donations.map((d) => `<div class="line"><span class="who">${esc(d.donor)}</span><span class="when">${fmtDate(d.at)}</span><span class="dots"></span><span class="val">${money(d.amount)}</span></div>`).join("")}</div>`
  : '<p class="empty">No payments recorded yet.</p>';
async function render() {
  const out = document.getElementById("out");
  try {
    const { contributions } = await api("data");
    if (!contributions.length) { out.innerHTML = '<p class="empty" style="text-align:center">No contributions yet.</p>'; return; }
    out.innerHTML = groups(contributions).map((g) => {
      const multi = g.items.length > 1;
      const n = g.items.reduce((t, c) => t + c.donations.length, 0);
      return `<section class="group"><div class="ghead"><h2>${esc(g.name)}</h2><div class="amt">${money(total(g.items))}</div></div>
      <p class="meta">${multi ? `Combined total of ${g.items.length} contributions · ` : ""}${n} ${n === 1 ? "donor" : "donors"}</p>
      ${g.items.map((c) => `<div class="part">${multi || c.title !== g.name ? `<div class="sub-h"><h3>${esc(c.title)}</h3><span class="amt">${money(sum(c))}</span></div>` : ""}${lines(c)}</div>`).join("")}</section>`;
    }).join("");
    document.getElementById("foot").textContent = "Last refreshed " + new Date().toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  } catch (e) { out.innerHTML = '<p class="err">Could not load the list. Please refresh the page.</p>'; }
}
render(); setInterval(render, 30000);
</script></body></html>
