<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Group Contributions</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap">
<h1>Group Contributions</h1><p class="sub">Latest list, updated as payments are recorded.</p><div id="out"><p class="muted">Loading…</p></div>
</div><script type="module">
import { api, esc, money, sum, total, groups } from "./app.js";
async function render() {
  try {
    const { contributions } = await api("data");
    const out = document.getElementById("out");
    if (!contributions.length) { out.innerHTML = '<p class="muted">No contributions yet.</p>'; return; }
    out.innerHTML = groups(contributions).map((g) => {
      const multi = g.items.length > 1;
      return `<section class="group"><div class="gtitle"><h2>${esc(g.name)}</h2><div class="big">${money(total(g.items))}</div></div>
      ${multi ? `<p class="muted">Combined total of ${g.items.length} contributions</p>` : ""}
      ${g.items.map((c) => `<div class="part">${multi || c.title !== g.name ? `<h3><span>${esc(c.title)}</span><span>${money(sum(c))}</span></h3>` : ""}
      ${c.donations.length ? `<table><tr><th>Donor</th><th class="n">Amount</th></tr>${c.donations.map((d) => `<tr><td>${esc(d.donor)}</td><td class="n">${money(d.amount)}</td></tr>`).join("")}</table>` : '<p class="muted">No payments yet.</p>'}</div>`).join("")}</section>`;
    }).join("");
  } catch (e) { document.getElementById("out").innerHTML = '<p class="msg err">Could not load the list. Refresh to try again.</p>'; }
}
render(); setInterval(render, 30000);
</script></body></html>
