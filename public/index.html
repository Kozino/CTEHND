<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Group Contributions</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f9;--paper:#fff;--ink:#11203a;--mute:#69728a;--brass:#9a762f;--line:#d9dce3;--dot:#aab1c2}
@media(prefers-color-scheme:dark){:root{--bg:#0d1526;--paper:#142038;--ink:#eef0f5;--mute:#98a2ba;--brass:#d2ac62;--line:#27344f;--dot:#4a587a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:48px 18px 72px}
header{text-align:center;margin-bottom:40px}
h1,h2,h3,.amt{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-variant-numeric:lining-nums tabular-nums}
h1{font-size:clamp(2.2rem,7vw,3.2rem);font-weight:600;letter-spacing:.01em;line-height:1.1;margin:0 0 14px}
.rule{width:84px;height:5px;margin:0 auto 14px;border-top:1px solid var(--brass);border-bottom:1px solid var(--brass)}
.sub{margin:0;color:var(--mute);font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1.15rem}
.group{position:relative;background:var(--paper);border:1px solid var(--line);padding:30px 30px 22px;margin-bottom:28px;
  box-shadow:inset 0 0 0 5px var(--paper),inset 0 0 0 6px var(--line)}
.ghead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--brass)}
.ghead h2{margin:0;font-size:clamp(1.6rem,5vw,2.05rem);font-weight:600;line-height:1.15}
.amt{font-size:clamp(2rem,7vw,2.7rem);font-weight:600;color:var(--brass);line-height:1}
.meta{margin:8px 0 0;color:var(--mute);font-size:.92rem}
.part{margin-top:22px}
.sub-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sub-h h3{margin:0;font-size:1.3rem;font-weight:600;font-style:italic}
.sub-h span.amt{font-size:1.3rem}
.ledger{margin-top:6px}
.line{display:flex;align-items:baseline;gap:8px;padding:9px 0}
.line .who{min-width:0;overflow-wrap:anywhere}
.line .when{color:var(--mute);font-size:.8rem;white-space:nowrap}
.line .dots{flex:1;min-width:16px;border-bottom:1px dotted var(--dot);transform:translateY(-4px)}
.line .val{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.empty{color:var(--mute);font-style:italic;margin:10px 0 0}
.err{padding:12px 14px;border:1px solid #b3261e;color:#b3261e;text-align:center}
footer{text-align:center;color:var(--mute);font-size:.82rem;margin-top:8px}
@media(max-width:480px){.group{padding:24px 20px 16px}.line .when{display:none}}
</style></head><body><div class="wrap">
<header><h1>Group Contributions</h1><div class="rule"></div><p class="sub">The latest list, updated as payments are recorded</p></header>
<main id="out"><p class="empty" style="text-align:center">Loading…</p></main>
<footer id="foot"></footer>
</div><script type="module">
import { api, esc, money, sum, total, groups } from "./app.js";
const fmtDate = (s) => s ? new Date(s).toLocaleDateString(undefined, { day: "numeric", month: "short" }) : "";
const lines = (c) => c.donations.length
  ? `<div class="ledger">${c.donations.map((d) => `<div class="line"><span class="who">${esc(d.donor)}</span><span class="when">${fmtDate(d.at)}</span><span class="dots"></span><span class="val">${money(d.amount)}</span></div>`).join("")}</div>`
  : '<p class="empty">No payments recorded yet.</p>';
async function render() {
  const out = document.getElementById("out");
  try {
    const { contributions } = await api("data");
    if (!contributions.length) { out.innerHTML = '<p class="empty" style="text-align:center">No contributions yet.</p>'; return; }
    out.innerHTML = groups(contributions).map((g) => {
      const multi = g.items.length > 1;
      const n = g.items.reduce((t, c) => t + c.donations.length, 0);
      return `<section class="group"><div class="ghead"><h2>${esc(g.name)}</h2><div class="amt">${money(total(g.items))}</div></div>
      <p class="meta">${multi ? `Combined total of ${g.items.length} contributions · ` : ""}${n} ${n === 1 ? "donor" : "donors"}</p>
      ${g.items.map((c) => `<div class="part">${multi || c.title !== g.name ? `<div class="sub-h"><h3>${esc(c.title)}</h3><span class="amt">${money(sum(c))}</span></div>` : ""}${lines(c)}</div>`).join("")}</section>`;
    }).join("");
    document.getElementById("foot").textContent = "Last refreshed " + new Date().toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  } catch (e) { out.innerHTML = '<p class="err">Could not load the list. Please refresh the page.</p>'; }
}
render(); setInterval(render, 30000);
</script></body></html>
